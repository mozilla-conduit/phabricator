name: Build and Push

on:
  push:
    branches:
      - master
    tags:
      - release-**

jobs:
  build-and-push:
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: mozilla/deploy-actions/.github/workflows/build-and-push.yml@main
    with:
      image_name: phabricator
      gar_name: phabricator-prod
      project_id: moz-fx-phabricator-prod

  push-dockerhub:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # Same tags and version.json as the GAR image built by deploy-actions.
      - name: Generate tags and version.json
        id: meta
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          IMAGE: mozillaconduit/phabricator
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" == "tag" ]]; then
            tags="$IMAGE:$REF_NAME"
          else
            tags="$IMAGE:$(git rev-parse --short=10 HEAD),$IMAGE:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          printf '{"commit":"%s","version":"%s","source":"%s","build":"%s"}\n' \
            "$GITHUB_SHA" \
            "$GITHUB_REF_NAME" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > version.json
      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and Push to Docker Hub
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
