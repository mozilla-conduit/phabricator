name: CI

on:
  pull_request:
    branches:
      - master

jobs:
  php-syntax:
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The Dockerfile's base image is the source of truth for the PHP version.
      # composer.json must pin the same version, as Dependabot resolves
      # Composer updates against it.
      - name: Get PHP version
        id: php-version
        run: |
          version=$(sed -n 's/^FROM php:\([0-9]*\.[0-9]*\).*/\1/p' Dockerfile)
          test -n "$version"
          composer_version=$(jq -r '.config.platform.php' composer.json)
          if [ "$version" != "$composer_version" ]; then
            echo "::error file=composer.json::config.platform.php is $composer_version but the Dockerfile uses PHP $version. Update composer.json and run 'composer update --lock'."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ steps.php-version.outputs.version }}

      - name: Check PHP syntax
        run: |
          find . \
            -name "*.php" \
            -not -path "./.git/*" \
            -not -path "./externals/*" \
            -print0 \
            | xargs -0 -n1 php -l

  json-lint:
    name: JSON Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate JSON files
        run: |
          find . \
            \( -path "./.git" -o -path "./externals" \) -prune -o \
            -name "*.json" \
            -print0 \
            | xargs -0 -I{} jq empty {}

  phab-tests:
    name: Phabricator Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install just
        run: sudo apt-get update && sudo apt-get install --yes just

      - name: Build production image
        run: just build-production
      - name: Build tools image
        run: just build
      - name: Run tests
        run: just test

  phab-lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # `just lint` lints the changes since `origin/master`.
          fetch-depth: 0

      - name: Install just
        run: sudo apt-get update && sudo apt-get install --yes just

      - name: Build tools image
        run: just build
      - name: Lint changes
        run: just lint
      - name: Run PHPStan
        run: just phpstan
