name: CI

on:
  pull_request:
    branches:
      - master

jobs:
  php-syntax:
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'

      - name: Check PHP syntax
        run: |
          find . \
            -name "*.php" \
            -not -path "./.git/*" \
            -not -path "./externals/*" \
            -print0 \
            | xargs -0 -n1 php -l

  json-lint:
    name: JSON Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON files
        run: |
          find . \
            \( -path "./.git" -o -path "./externals" \) -prune -o \
            -name "*.json" \
            -print0 \
            | xargs -0 -I{} jq empty {}

  phab-tests:
    name: Phabricator Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install just
        run: sudo apt-get update && sudo apt-get install --yes just

      - name: Build production image
        run: just build-production
      - name: Build tools image
        run: just build
      - name: Run tests
        run: just test

  phab-lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # `just lint` lints the changes since `origin/master`.
          fetch-depth: 0

      - name: Install just
        run: sudo apt-get update && sudo apt-get install --yes just

      - name: Build tools image
        run: just build
      - name: Lint changes
        run: just lint
