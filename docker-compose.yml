version: '3.4'
services:
  # Phabricator Containers
  phabricator.test:
    image: nginx:alpine
    volumes:
      - ./docker/phabricator/site.conf:/etc/nginx/conf.d/default.conf:ro
      - phabricator-app:/app
    restart: on-failure
    depends_on:
      - phabricator
      - tinyproxy

  phabricator:
    build:
      context: .
      dockerfile: ./Dockerfile
    entrypoint: /app/entrypoint.sh
    command: dev_start
    environment: &phab_env
      - MYSQL_HOST=phabdb
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASS=password
      - PHABRICATOR_URI=http://phabricator.test/
      - PHABRICATOR_CDN_URI=http://phabricator.test/
      - BUGZILLA_URL=http://bmo.test
      - BUGZILLA_AUTOMATION_USER=phab-bot@bmo.tld
      - BUGZILLA_AUTOMATION_API_KEY=8G4ly8JkxbypZgh5XrdiHWExVEjPq5S3HvMBll1K
    restart: on-failure
    depends_on:
      - phabdb
    volumes:
      - phabricator-app:/app

  # Runs tests, linters and map rebuilds against the checkout. Use the
  # `justfile` rather than running this service directly; see
  # `docker/tools/run.sh`.
  tools:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: test
    entrypoint: /src/docker/tools/run.sh
    # Run as the host user so that files written into the checkout (library
    # and Celerity maps, lint fixes) keep the host user's ownership.
    user: "${HOST_UID:-10001}:${HOST_GID:-10001}"
    environment:
      - MYSQL_HOST=phabdb
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASS=password
      - HOME=/tmp
      # The image's `/app/.git` belongs to the image's `app` user.
      - GIT_CONFIG_COUNT=1
      - GIT_CONFIG_KEY_0=safe.directory
      - GIT_CONFIG_VALUE_0=*
    depends_on:
      - phabdb
    volumes:
      - .:/src
      # In a `git worktree`, `.git` is a file pointing into the main
      # repository's `.git` directory by absolute path.
      - ${GIT_COMMON_DIR:-./.git}:${GIT_COMMON_DIR:-/src/.git}
      - ./bin:/app/phabricator/bin
      - ./resources:/app/phabricator/resources
      - ./scripts:/app/phabricator/scripts
      - ./src:/app/phabricator/src
      - ./support:/app/phabricator/support
      - ./webroot:/app/phabricator/webroot
      - ./moz-extensions:/app/moz-extensions
      - ./docker/tools/local.json:/app/phabricator/conf/local/local.json:ro

  phabdb:
    image: mysql:5.7
    volumes:
      - phabricator-mysql-db:/var/lib/mysql
      - ./docker/phabricator/mysql:/etc/mysql/conf.d:ro
    environment:
      - MYSQL_ROOT_PASSWORD=password
    restart: on-failure

  # Other Support Containers
  tinyproxy:
    build:
      context: docker/tinyproxy
      dockerfile: ./Dockerfile
    ports:
      - "1090:1090"

# Volume Containers
volumes:
  phabricator-mysql-db:
  phabricator-app:
